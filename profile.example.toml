# Default profile: a beginner on a $20-50k account running the wheel at ~35 DTE.
# Do not edit this file for yourself. Ask the agent to "set me up": the wheel-onboard
# skill interviews you and writes profile.toml (gitignored), which overrides this one.

[account]
size_usd = 35000              # rough size, for context only. Caps below are read live.
emergency_buffer_usd = 0      # cash kept OUTSIDE the broker. Never counted as collateral.
experience = "beginner"       # beginner | intermediate | advanced
live_trading = false          # --execute only works on a paper (DU...) account until true
options_level = "cash-secured puts + covered calls"
profitable_cycles = 0         # closed wheel cycles with positive realized cash
notes = ""                    # tax situation, goals, anything the agent should remember

[wheel]
dte_target = 35               # the standard monthly expiry usually lands here
dte_band = [28, 45]
delta_band = [0.20, 0.30]
min_credit = 35.0             # dollars per contract; below this, commissions eat the trade
min_open_interest = 500
min_underlying_price = 5.0
max_spread_frac = 0.10        # bid/ask width as a fraction of mid

[sizing]
# Beginner ramp. After 3 profitable cycles AND at least $50k excess liquidity, onboarding
# may raise these to 0.35 / 0.60 / 3. Never before.
max_position_collateral_frac = 0.30  # of excess liquidity, one position
max_total_collateral_frac = 0.50     # of excess liquidity, all open short puts combined
max_cash_collateral_frac = 0.95      # of free settled cash, one position
# Share of each put's full obligation (strike x 100) that must sit in free settled cash.
# 1.0 = fully cash-secured: assignment can always be paid for in cash. Recommended.
# Below 1.0 the rest is borrowed on margin when assigned. Not allowed for beginners.
cash_secured_frac = 1.0
max_positions = 2
contracts_per_position = 1           # raise only after 3 profitable cycles

[universe]
# Never write either side. Covered-call funds already sell the premium you'd be selling.
excluded = ["QYLD", "JEPQ", "XYLD", "RYLD"]
# Over your concentration cap. Short puts blocked (they add exposure); covered calls allowed.
overweight = []
