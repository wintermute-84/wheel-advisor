# ABOUTME: Project configuration for the wheel-advisor options-income workspace.
# ABOUTME: Defines dependencies and dev tools for the wheel/covered-call advisor.

[project]
name = "wheel-advisor"
version = "0.1.0"
description = "Claude Code workspace for running the options wheel on Interactive Brokers: screening, guarded dry-run order staging, and trade journaling"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "yfinance>=0.2.50",
    "ib-async>=2.1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    # Transitive but required: yfinance calls pandas.read_html() internally for
    # earnings data, which needs lxml. Not imported by any of our modules, so it
    # looks removable and is not — earnings timing/EPS silently break without it.
    "lxml>=6.0.2",
    "python-dotenv>=1.0",
    "pandas-market-calendars>=5.3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_skills"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["manual: requires live broker connection (deselected by default)"]
# Many tests query live market-data APIs, which intermittently rate-limit or
# time out. Retrying absorbs those transients; a deterministic failure still
# fails every attempt.
addopts = "-m 'not manual' --reruns 2 --reruns-delay 2"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0.0",
    "pytest-rerunfailures>=15.0",
    "ruff>=0.8",
]
